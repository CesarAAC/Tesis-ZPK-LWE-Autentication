services:
  db:
    image: postgres:15-alpine
    container_name: lwe_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lwe_auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-lwe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lwe_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lwe_user} -d ${POSTGRES_DB:-lwe_auth_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${API_IMAGE_NAME:-lwe-auth-project-api:local}
    container_name: lwe_api_service
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8010"
    volumes:
      - ./backend:/app

  benchmark:
    image: ${API_IMAGE_NAME:-lwe-auth-project-api:local}
    profiles: ["tools"]
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://lwe_user:lwe_password@db:5432/lwe_auth_db}
    volumes:
      - ./backend:/app
    entrypoint: []

volumes:
  postgres_data:
