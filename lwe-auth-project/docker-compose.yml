version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lwe_postgres_db
    restart: always
    environment:
      POSTGRES_DB: lwe_auth_db
      POSTGRES_USER: lwe_user
      POSTGRES_PASSWORD: lwe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lwe_user -d lwe_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lwe_api_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lwe_user:lwe_password@db:5432/lwe_auth_db
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: