services:
  db:
    image: postgres:15-alpine
    container_name: lwe_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lwe_auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-lwe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lwe_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lwe_user} -d ${POSTGRES_DB:-lwe_auth_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lwe_api_service
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8010"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
